name: Build Black Fury APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip (if uploaded)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE — extracting over the repo..."
            rm -rf /tmp/extracted
            mkdir -p /tmp/extracted
            unzip -o "$ZIP_FILE" -d /tmp/extracted
            # The zip may contain one top-level folder (e.g. black_fury/) —
            # if so, copy ITS contents to the repo root; otherwise copy
            # the extracted root directly.
            SRC_DIR=$(find /tmp/extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
            SRC_FILE_COUNT=$(find /tmp/extracted -maxdepth 1 -mindepth 1 -type f | wc -l)
            if [ -n "$SRC_DIR" ] && [ "$SRC_FILE_COUNT" -eq 0 ]; then
              cp -rf "$SRC_DIR"/. .
            else
              cp -rf /tmp/extracted/. .
            fi
            echo "Extraction complete. lib/ now contains:"
            find lib -maxdepth 1
          else
            echo "No zip file found at repo root — using repo files as-is."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Scaffold Android platform folder (first run only)
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/backup
            cp -r lib /tmp/backup/lib
            cp pubspec.yaml /tmp/backup/pubspec.yaml
            flutter create --platforms=android --org com.blackfury .
            rm -rf lib
            cp -r /tmp/backup/lib lib
            cp /tmp/backup/pubspec.yaml pubspec.yaml
          fi

      - name: Set application ID to com.blackfury.vehiclecontrol
        run: |
          OLD_ID="com.blackfury.black_fury"
          NEW_ID="com.blackfury.vehiclecontrol"
          grep -rl "$OLD_ID" android/ 2>/dev/null | xargs -r sed -i "s/$OLD_ID/$NEW_ID/g" || true
          OLD_DIR=$(find android -type d -path "*/com/blackfury/black_fury" 2>/dev/null || true)
          if [ -n "$OLD_DIR" ]; then
            NEW_DIR="$(dirname "$OLD_DIR")/vehiclecontrol"
            mkdir -p "$NEW_DIR"
            mv "$OLD_DIR"/* "$NEW_DIR"/ 2>/dev/null || true
            rmdir "$OLD_DIR" 2>/dev/null || true
          fi

      - name: Ensure INTERNET permission is declared
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi

      - name: Generate launcher icons (Toothless icon)
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-fury-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
